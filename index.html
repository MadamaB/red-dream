<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE RED DREAM</title>
<meta name="description" content="THE RED DREAM — a journey through the unreal.">
<meta name="theme-color" content="#0a0103">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0103;color:#e9c9c9;font:400 10px/1 'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;background:radial-gradient(70% 60% at 50% 55%,#2a0408,#070102 75%);transition:opacity 2.4s cubic-bezier(.16,1,.3,1),visibility 2.4s}
.gate.is-gone{opacity:0;visibility:hidden}
.gate__in{display:grid;gap:22px;justify-items:center}
.gate h1{font:300 clamp(40px,7vw,104px)/.9 'Cormorant Garamond',Georgia,serif;letter-spacing:.14em;text-indent:.14em;color:#f2d6d4}
.gate p{font:italic 300 clamp(16px,1.6vw,22px)/1.3 'Cormorant Garamond',Georgia,serif;color:#b98a8c}
.gate button{margin-top:18px;font:500 10px/1 'Inter Tight',sans-serif;letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;color:#f2d6d4;background:none;border:1px solid rgba(242,214,212,.35);border-radius:999px;padding:18px 30px;cursor:pointer;transition:border-color .5s,background .5s,color .5s}
.gate button:hover,.gate button:focus-visible{border-color:#f2d6d4;background:rgba(242,214,212,.08);outline:none}
.gate small{font:400 9px/1.6 'Inter Tight',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:rgba(233,201,201,.35)}
.snd{position:fixed;right:20px;bottom:18px;z-index:5;font:500 9px/1 'Inter Tight',sans-serif;letter-spacing:.38em;text-indent:.38em;text-transform:uppercase;color:#e9c9c9;background:rgba(10,1,3,.3);border:1px solid rgba(233,201,201,.25);border-radius:999px;padding:11px 15px;cursor:pointer;opacity:0;transition:opacity 2s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.snd.is-on{opacity:.75}.snd:hover,.snd:focus-visible{opacity:1;outline:none;border-color:#e9c9c9}
.prog{position:fixed;left:50%;bottom:24px;z-index:5;width:min(220px,40vw);height:1px;transform:translateX(-50%);background:rgba(233,201,201,.14);opacity:0;transition:opacity 2s}
.prog.is-on{opacity:1}.prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(242,214,212,.7)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.endglow{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(70% 60% at 50% 55%,#b0202c 0%,#5a0610 50%,#1a0204 100%)}
.endtitle{position:fixed;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none;opacity:0;text-align:center}
.endtitle h2{font:300 clamp(40px,7vw,104px)/.9 'Cormorant Garamond',Georgia,serif;letter-spacing:.14em;text-indent:.14em;color:#f6dcda;text-shadow:0 0 40px rgba(255,120,120,.35);transform:scale(calc(.97 + var(--k,0) * .03))}
</style>
</head>
<body>
<canvas id="c" aria-label="THE RED DREAM — scroll to drift forward; move the cursor to disturb the dream."></canvas>
<div class="gate" id="gate"><div class="gate__in">
  <h1>THE RED DREAM</h1>
  <p>A journey through the unreal.</p>
  <button id="enter">Enter the dream</button>
  <small>sound on · headphones · let it carry you</small>
</div></div>
<div class="endtitle" id="endtitle" aria-hidden="true"><h2>THE RED DREAM</h2></div>
<button class="snd" id="snd" aria-pressed="false">Sound off</button>
<div class="prog" id="prog" aria-hidden="true"><i></i></div>
<p class="sr" id="st" aria-live="polite"></p>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const $ = s => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LITE = location.search.includes('lite') || matchMedia('(pointer: coarse)').matches || (navigator.hardwareConcurrency || 8) <= 4;
const lerp = (a, b, k) => a + (b - a) * k, clamp01 = x => Math.max(0, Math.min(1, x));
const smooth = (a, b, x) => { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const now = () => performance.now() / 1000;
let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };

/* ================================ THE DREAM'S MAP ================================
   One continuous drift along -z. 0 → -86: THE DESCENT (crimson hall, chains, silk, a film of liquid on the floor, a lit opening).
   -70 → -110: the chains melt into liquid strands, their drops become ripples, the hall dissolves.
   -100 → -190: THE WHITE SWAN on an endless crimson lake. (Chapters III–V will continue beyond.) */
const Z_OPEN = -86, Z_END = -408;

/* ================================ RENDERER ================================ */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !LITE, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, LITE ? 1 : 1.75)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .95;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0103);
scene.fog = new THREE.FogExp2(0x1a0306, .032);
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, .05, 600);

// what the metal reflects: a dark red room with a few soft lights
{ const soft = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, '#fff'); g.addColorStop(.5, 'rgba(255,255,255,.7)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
  const env = new THREE.Scene(); env.background = new THREE.Color(0x120204);
  for (const [w, h, x, y, z, c, k] of [[20, 14, 0, 4, -20, 0xffd8d0, 1.6], [10, 24, -14, 6, 2, 0xff3040, 1.1], [10, 24, 14, 6, 2, 0xff3040, 1.1], [30, 6, 0, 18, 0, 0xffffff, .9], [16, 10, 0, -8, 14, 0x801018, .6]]){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: soft, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); }
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(env, .02).texture;
  // the chains see a cooler world, so they read as silver against the red
  const env2 = new THREE.Scene(); env2.background = new THREE.Color(0x0c0809);
  for (const [w, h, x, y, z, k] of [[26, 10, 0, 14, -10, 2.4], [8, 30, -14, 4, 4, 1.4], [8, 30, 14, 4, -6, 1.1], [20, 8, 0, -6, 14, .5]]){ const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: soft, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: new THREE.Color(1, .96, .97).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env2.add(m); }
  window.__silverEnv = new THREE.PMREMGenerator(renderer).fromScene(env2, .02).texture; }

const NOISE = /* glsl */`
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f); return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 4; i++){ s += a * vn(p); p *= 2.03; a *= .5; } return s; }`;

/* ================================ THE LIQUID FLOOR → THE LAKE ================================
   One mirror of liquid from the hall to the horizon: a thin film under the chains, then the still crimson lake. It reflects
   everything, ripples where drops fall, where the swan swims and where the cursor touches. */
const RIP = 12, ripples = Array.from({ length: RIP }, () => new THREE.Vector4(0, 0, -99, 0)); let ripI = 0;
function ripple(x, z, amp = 1){ ripples[ripI].set(x, z, now(), amp); ripI = (ripI + 1) % RIP; if (typeof Sound !== 'undefined' && typeof camera !== 'undefined' && Math.abs(z - camera.position.z) < 45) Sound.ripple(Math.max(-1, Math.min(1, (x - camera.position.x) / 10)), Math.min(1, amp)); }
const waterU = { uSunDir: { value: new THREE.Vector3(0, .3, -1) }, uSunCol: { value: new THREE.Color(1, .8, .8) }, uPal: { value: 0 }, uFogC: { value: new THREE.Color() }, uFogD: { value: .03 }, uT: { value: 0 }, uRip: { value: ripples }, uLake: { value: 0 }, uSwan: { value: new THREE.Vector3(0, 0, -150) }, uStretch: { value: 0 } };
const WATER_FN = /* glsl */`
uniform float uT, uLake, uStretch, uFogD, uPal; uniform vec4 uRip[${RIP}]; uniform vec3 uSwan, uFogC, uSunDir, uSunCol;
${NOISE}
vec2 slope(vec2 p){                                     // the surface: slow sheets of flow in the hall, almost still on the lake, plus every ripple
  float still = mix(1., .9, uLake);
  vec2 g = vec2(0.);
  g += still * .5 * vec2(sin(p.x * .35 + uT * .4 + sin(p.y * .21)), cos(p.y * .28 - uT * .33 + sin(p.x * .17))) * .18;
  g += still * .6 * (vec2(fbm(p * .4 + vec2(uT * .05, 0.)), fbm(p * .4 + vec2(3.1, uT * .04))) - .5);
  for (int i = 0; i < ${RIP}; i++){ vec4 r = uRip[i]; float age = uT - r.z; if (age < 0. || age > 7.) continue;
    vec2 d = p - r.xy; float dist = length(d), front = age * 1.6; float ring = sin((dist - front) * 5.5) * exp(-pow(dist - front, 2.) * 1.6) * exp(-age * .45) * r.w;
    g += normalize(d + 1e-4) * ring * .55; }
  g += (vec2(vn(p * 3.3 + vec2(uT * .21, 0.)), vn(p * 3.1 + vec2(7.3, uT * .17))) - .5) * .07 + (vec2(vn(p * 9. - uT * .3), vn(p * 8.7 + 4.)) - .5) * .025;   // micro ripples
  return g; }`;
const water = (() => {
  if (LITE) { const m = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), new THREE.MeshPhysicalMaterial({ color: 0x1a0205, roughness: .08, metalness: .2, clearcoat: 1 })); m.rotation.x = -Math.PI / 2; m.position.set(0, 0, -150); scene.add(m); return m; }
  const shader = { name: 'RedWater', uniforms: Object.assign({ color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null } }, waterU),
    vertexShader: `uniform mat4 textureMatrix; varying vec4 vUvR; varying vec3 vW; #include <common>
      #include <logdepthbuf_pars_vertex>
      void main(){ vUvR = textureMatrix * vec4(position, 1.); vW = (modelMatrix * vec4(position, 1.)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.);
      #include <logdepthbuf_vertex>
      }`.replace('#include <common>', '\n#include <common>\n'),
    fragmentShader: `uniform vec3 color; uniform sampler2D tDiffuse; varying vec4 vUvR; varying vec3 vW;
      ${WATER_FN}
      #include <logdepthbuf_pars_fragment>
      void main(){
        #include <logdepthbuf_fragment>
        vec2 g = slope(vW.xz);
        vec4 uv = vUvR; uv.xy += g * mix(.028, .045, uLake) * uv.w;
        // the swan's reflection stretches, slowly, unnaturally, as the dream loosens
        float sw = exp(-pow(vW.x - uSwan.x, 2.) / 10.) * smoothstep(-40., 0., vW.z - uSwan.z) * (1. - smoothstep(0., 30., vW.z - uSwan.z - 4.));
        uv.y += uStretch * sw * .35 * uv.w * (vW.z - uSwan.z) * .06;
        float dist = length(cameraPosition - vW), br = (.0015 + dist * .00012) * uv.w;             // the further, the softer the reflection
        vec3 refl = (texture2DProj(tDiffuse, uv).rgb * 2. + texture2DProj(tDiffuse, uv + vec4(br, 0., 0., 0.)).rgb + texture2DProj(tDiffuse, uv - vec4(br, 0., 0., 0.)).rgb + texture2DProj(tDiffuse, uv + vec4(0., br * 1.6, 0., 0.)).rgb + texture2DProj(tDiffuse, uv - vec4(0., br * 1.6, 0., 0.)).rgb) / 6.;
        vec3 base = mix(mix(vec3(.05, .004, .008), vec3(.07, .004, .012), uLake), vec3(.62, .46, .5), uPal);
        vec3 V = normalize(cameraPosition - vW), N = normalize(vec3(-g.x * .9, 1., -g.y * .9));
        float cosT = clamp(dot(V, N), 0., 1.), F = .02 + .98 * pow(1. - cosT, 5.);
        float fres = clamp(.42 + F * 1.25, 0., 1.);
        vec3 R = reflect(-V, N); float sp = max(dot(R, normalize(uSunDir)), 0.);
        vec3 glint = uSunCol * (pow(sp, 900.) * 6. + pow(sp, 60.) * .08);
        vec3 c = mix(base, refl * mix(mix(vec3(1., .55, .6), vec3(.95, .62, .66), uLake), vec3(1.), uPal), fres * mix(.92, .8, uLake));
        c += vec3(1., .88, .88) * pow(max(0., length(g) * 2.4 - .45), 2.5) * mix(.25, .6, uLake);         // silver lines on the crests
        c += glint * (1. - uPal * .4);
        float fd = length(cameraPosition - vW) * uFogD; c = mix(c, uFogC, 1. - exp(-fd * fd));
        gl_FragColor = vec4(c, 1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }` };
  const m = new Reflector(new THREE.PlaneGeometry(700, 700), { textureWidth: innerWidth * .6, textureHeight: innerHeight * .6, clipBias: .003, shader });
  m.material.uniforms.uRip.value = ripples;
  m.rotation.x = -Math.PI / 2; m.position.set(0, 0, -150); scene.add(m); return m; })();
const WU = water.material.uniforms || waterU;

/* ================================ CHAPTER I — THE DESCENT ================================ */
const hall = new THREE.Group(); scene.add(hall);
// dissolving materials: everything of the hall melts away, from its far end, as the dream moves on
const dissolveU = { uDis: { value: 0 } };
function dissolving(mat){ mat.onBeforeCompile = sh => { sh.uniforms.uDis = dissolveU.uDis;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWd;').replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWd = (modelMatrix * vec4(transformed, 1.)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform float uDis; varying vec3 vWd;\n' + NOISE)
      .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\n float dn = fbm(vWd.xy * .35 + vWd.z * .07); if (dn < uDis * 1.3 - .15 + (vWd.z - (-90.)) * .004 * uDis) discard;'); };
  mat.customProgramCacheKey = () => 'dis' + mat.type; return mat; }
const lacquer = dissolving(new THREE.MeshPhysicalMaterial({ color: 0x2a0307, roughness: .3, clearcoat: .7, clearcoatRoughness: .2, sheen: .5, sheenColor: new THREE.Color(0x8a1020) }));
// tall crimson panels either side, light bleeding through the gaps between them
for (let i = 0; i < 14; i++) for (const sd of [-1, 1]){
  const z = 2 - i * 6.4, w = 2.2 + rnd() * 1.4, p = new THREE.Mesh(new THREE.BoxGeometry(.8, 26, w), lacquer); p.position.set(sd * (8.2 + rnd() * .8), 13, z); hall.add(p);
  if (i % 2 === 0){ const gl = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 24), new THREE.MeshBasicMaterial({ color: new THREE.Color(.55, .03, .05), transparent: true, opacity: .55, fog: true })); gl.position.set(sd * 9.6, 12, z - 3.2); gl.rotation.y = -sd * Math.PI / 2; hall.add(gl); } }
// the far wall, with its arched opening onto light
{ const s = new THREE.Shape(); s.moveTo(-30, 0); s.lineTo(30, 0); s.lineTo(30, 34); s.lineTo(-30, 34); s.lineTo(-30, 0);
  const h = new THREE.Path(); h.moveTo(-2.6, 0); h.lineTo(2.6, 0); h.lineTo(2.6, 10); h.absarc(0, 10, 2.6, 0, Math.PI, false); h.lineTo(-2.6, 0); s.holes.push(h);
  const wall = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: 1.2, bevelEnabled: false, curveSegments: 48 }), lacquer); wall.position.set(0, 0, Z_OPEN - .6); hall.add(wall); }
const openLight = new THREE.PointLight(0xffc0b8, 160, 60, 1.4); openLight.position.set(0, 6, Z_OPEN - 8); scene.add(openLight);
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), g = x.createRadialGradient(128, 150, 0, 128, 150, 128);
  g.addColorStop(0, 'rgba(255,240,236,1)'); g.addColorStop(.35, 'rgba(255,190,190,.65)'); g.addColorStop(1, 'rgba(255,120,130,0)'); x.fillStyle = g; x.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c); })();
const glowPlane = new THREE.Mesh(new THREE.PlaneGeometry(26, 30), new THREE.MeshBasicMaterial({ map: glowTex, color: new THREE.Color(1.5, .7, .7), transparent: true, opacity: .9, fog: false, depthWrite: false, blending: THREE.AdditiveBlending }));
glowPlane.position.set(0, 9, Z_OPEN - 14); scene.add(glowPlane);
const redKey = new THREE.SpotLight(0xff2a35, 900, 90, .6, .8, 1.3); redKey.position.set(0, 26, 0); redKey.target.position.set(0, 0, -40); scene.add(redKey, redKey.target);

// chains: long chrome chains hanging from an invisible ceiling; each is a pendulum the cursor can disturb; near the opening they
// melt into liquid strands whose drops fall and become ripples
const chrome = new THREE.MeshPhysicalMaterial({ color: 0xf2eef0, metalness: 1, roughness: .08, envMap: window.__silverEnv, envMapIntensity: 1.6, clearcoat: .6 });
const linkGeo = new THREE.TorusGeometry(1, .28, 8, 18);
const chains = [];
for (let i = 0; i < (LITE ? 18 : 30); i++){
  const z = 3 - rnd() * 92, side = rnd() < .5 ? -1 : 1, x = side * (1.1 + Math.pow(rnd(), .7) * 6), len = 6 + rnd() * 10, size = .12 + Math.pow(rnd(), 2) * .26;
  const pivot = new THREE.Group(); pivot.position.set(x, 17, z); scene.add(pivot);
  const n = Math.floor(len / (size * 1.55)), im = new THREE.InstancedMesh(linkGeo, chrome, n), d = new THREE.Object3D();
  for (let k = 0; k < n; k++){ d.position.set(0, -k * size * 1.55 - size, 0); d.rotation.set(0, k % 2 ? Math.PI / 2 : 0, Math.PI / 2); d.scale.set(size, size * .62, size); d.updateMatrix(); im.setMatrixAt(k, d.matrix); }
  pivot.add(im);
  // the liquid strand it becomes
  const strand = new THREE.Mesh(new THREE.CylinderGeometry(size * .35, size * .5, len, 10, 1, true), chrome); strand.position.y = -len / 2; strand.scale.set(.001, 1, .001); pivot.add(strand);
  const drop = new THREE.Mesh(new THREE.SphereGeometry(size * 1.2, 16, 12), chrome); drop.position.y = -len; drop.visible = false; pivot.add(drop);
  chains.push({ pivot, im, strand, drop, x, z, len, size, ax: 0, az: 0, vx: 0, vz: 0, ph: rnd() * 6, melt: 0, dropT: rnd() * 3, side });
}
// silk: translucent red fabric moving slowly through the air — two long hangings, a swag above, a veil across the path that parts
const silkU = { uT: { value: 0 } };
function silk(w, h, seg, opacity, tone){ const g = new THREE.PlaneGeometry(w, h, seg, Math.round(seg * h / w));
  const m = new THREE.MeshPhysicalMaterial({ color: tone, roughness: .45, sheen: 1, sheenRoughness: .35, sheenColor: new THREE.Color(0xff5060), transparent: true, opacity: opacity * .6, side: THREE.DoubleSide, depthWrite: false, emissive: 0x2a0106, emissiveIntensity: .35 });
  const u = { uT: silkU.uT, uAmp: { value: 1 }, uPart: { value: 0 }, uSeed: { value: rnd() * 10 }, uStretch: { value: 0 } };
  m.onBeforeCompile = sh => { Object.assign(sh.uniforms, u);
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uT, uAmp, uPart, uSeed, uStretch;\nvec3 silkP(vec3 p){ float hang = clamp(.5 - p.y / ' + h.toFixed(1) + ', 0., 1.);\n  p.z += (sin(p.x * .45 + uT * .5 + uSeed) * .9 + sin(p.y * .3 - uT * .37 + uSeed * 2.) * .6 + sin((p.x + p.y) * .9 + uT * .8) * .2) * uAmp * (.3 + hang);\n  p.x += sign(p.x) * uPart * (2. + hang * 6.) * smoothstep(0., 1.5, abs(p.x)); p.y -= uStretch * hang * 3.; return p; }')
      .replace('#include <beginnormal_vertex>', 'vec3 sp = silkP(position), sa = silkP(position + vec3(.05, 0., 0.)), sb = silkP(position + vec3(0., .05, 0.)); vec3 objectNormal = normalize(cross(sa - sp, sb - sp));')
      .replace('#include <begin_vertex>', 'vec3 transformed = sp;'); };
  m.customProgramCacheKey = () => 'silk';
  const mesh = new THREE.Mesh(g, m); mesh.userData.u = u; return mesh; }
const silks = [];
{ const a = silk(34, 18, 70, .5, 0x6a0612); a.position.set(-6.5, 12, -16); a.rotation.y = Math.PI / 2 + .1; scene.add(a); silks.push(a);
